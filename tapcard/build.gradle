plugins {
    id 'java-library'
}

java {
    sourceCompatibility = rootProject.ext.sourceCompatibilityVersion
    targetCompatibility = rootProject.ext.targetCompatibilityVersion
}

dependencies {
    testImplementation 'org.apache.commons:commons-lang3:3.14.0'
    testImplementation 'commons-io:commons-io:2.15.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.easytesting:fest-assert:1.4'
    testImplementation 'org.powermock:powermock-module-junit4:2.0.9'
    testImplementation 'org.powermock:powermock-api-easymock:2.0.9'
    testImplementation 'cglib:cglib:3.3.0'

    testImplementation 'org.slf4j:slf4j-api:1.7.36'
    testImplementation 'org.slf4j:slf4j-reload4j:1.7.36'
    testImplementation 'ch.qos.reload4j:reload4j:1.2.22'
}

// Optional card list refresh; do not fail the build if unavailable.
tasks.named('processResources').configure {
    doLast {
        // kept intentionally light for modern builds
    }
}
