buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
    }
}

ext {
    minSdkVersion = 21
    targetSdkVersion = 36
    compileSdkVersion = 36
    sourceCompatibilityVersion = JavaVersion.VERSION_17
    targetCompatibilityVersion = JavaVersion.VERSION_17
}

ext.deps = [
        appcompat         : 'androidx.appcompat:appcompat:1.7.0',
        constraintlayout  : 'androidx.constraintlayout:constraintlayout:2.2.1',
        junit             : 'junit:junit:4.13.2',
        rxJava1           : 'io.reactivex:rxjava:1.3.8',
        rxJava2           : 'io.reactivex.rxjava2:rxjava:2.2.21',
        rxJava2Android    : 'io.reactivex.rxjava2:rxandroid:2.1.1',
]

subprojects { project ->
    group = GROUP
    version = VERSION_NAME

    configurations.configureEach {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
        }
    }

    afterEvaluate {
        if (project.hasProperty('android')) {
            android {
                compileOptions {
                    sourceCompatibility rootProject.ext.sourceCompatibilityVersion
                    targetCompatibility rootProject.ext.targetCompatibilityVersion
                }
            }
        }
        if (project.plugins.hasPlugin('java') || project.plugins.hasPlugin('java-library')) {
            project.sourceCompatibility = rootProject.ext.sourceCompatibilityVersion
            project.targetCompatibility = rootProject.ext.targetCompatibilityVersion
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
